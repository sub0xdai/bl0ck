services:
  lina:
    build:
      context: .
      dockerfile: Containerfile
    image: lina-agent
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add other necessary env vars here or use .env file
    volumes:
      # CRITICAL: Persist wallet data
      - lina-data:/app/data
    restart: unless-stopped

volumes:
  lina-data:
