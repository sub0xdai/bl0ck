services:
  lina:
    build:
      context: .
      dockerfile: Containerfile
    image: lina-agent
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # CRITICAL: Persist wallet data
      - lina-data:/app/data
    restart: unless-stopped

volumes:
  lina-data:
