name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'lina/**'
      - 'frontend/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-lina:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        working-directory: lina
        run: bun install --ignore-scripts || true

      - name: Build application
        working-directory: lina
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_CDP_PROJECT_ID: ${{ secrets.VITE_CDP_PROJECT_ID }}
        run: bun run build

      - name: Build runtime container
        working-directory: lina
        run: |
          docker build -t lina:latest -f Containerfile.runtime .
          docker save lina:latest | gzip > lina-image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "lina/lina-image.tar.gz"
          target: "/root/"
          strip_components: 1

      - name: Deploy container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Load the new image
            gunzip -c /root/lina-image.tar.gz | podman load
            rm /root/lina-image.tar.gz

            # Stop and remove old container
            podman stop lina 2>/dev/null || true
            podman rm lina 2>/dev/null || true

            # Run new container
            podman run -d \
              --name lina \
              --env-file /root/bl0ck/lina/.env \
              -p 3000:3000 \
              --restart unless-stopped \
              lina:latest

            # Wait for startup and verify
            sleep 10
            curl -s http://localhost:3000/api/agents | head -100

            # Cleanup old images
            podman image prune -f

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete
          path: frontend/out/
          remote_path: /var/www/bl0ck/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
