# Bun test configuration for Lina

[test]
# Test timeout in milliseconds
timeout = 30000

# Root directory for tests
root = "src"

# Enable coverage
coverage = true

# Test environment
env = "node"

# Path aliases (must match tsconfig.json paths)
[test.alias]
"@/managers" = "./src/managers"
"@/constants" = "./src/constants"
"@/repositories" = "./src/repositories"

# Coverage exclusions
coverage-exclude = [
  "**/dist/**",
  "**/*.test.ts",
  "**/fixtures/**",
  "**/helpers/**",
  "**/node_modules/**"
]
