name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'lina/**'
      - 'frontend/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-lina:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: lina
          file: lina/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lina:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
            VITE_CDP_PROJECT_ID=${{ secrets.VITE_CDP_PROJECT_ID }}

      - name: Deploy container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Pull the new image from registry
            podman pull ghcr.io/${{ github.repository_owner }}/lina:latest

            # Stop and remove old container
            podman stop lina 2>/dev/null || true
            podman rm lina 2>/dev/null || true

            # Run new container
            podman run -d \
              --name lina \
              --env-file /root/bl0ck/lina/.env \
              -p 3000:3000 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/lina:latest

            # Wait for startup and verify
            sleep 10
            curl -s http://localhost:3000/api/agents | head -100

            # Cleanup old images
            podman image prune -f

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "Starting build..."
          npm run build
          echo "Build completed. Checking output..."
          ls -la
          ls -la out/ || echo "out/ not found in frontend/"

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete
          path: frontend/out/
          remote_path: /var/www/bl0ck/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
